name: Model eval
# Manual only, so it costs Actions minutes only when started. Compares model setups on one day's world
# articles (decision 28). Download the report from the run's artifacts.
on:
  workflow_dispatch:
    inputs:
      date:
        description: Run date (YYYY-MM-DD). Defaults to today.
        required: false
      setups:
        description: 'Setups split by ";". Empty runs the default comparison (docs/RUNBOOK.md, "Choose a model").'
        required: false
      fixture:
        description: '"clean" runs the fictional day, "injection" the fictional day with two hostile outlets (decision 165). Both run in memory. Empty uses the real day.'
        required: false
permissions:
  contents: read
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # With DATABASE_URL the day comes from the database; without it, from the live feeds.
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      # Each setup gets its own in-memory database, so this ceiling applies per setup.
      DAILY_SPEND_CEILING_USD: "1.00"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run the eval
        env:
          DATE: ${{ inputs.date }}
          SETUPS: ${{ inputs.setups }}
          FIXTURE: ${{ inputs.fixture }}
        run: |
          args=(eval)
          if [ "$FIXTURE" = clean ]; then args+=(--fixture); fi
          if [ "$FIXTURE" = injection ]; then args+=(--injection); fi
          if [ -n "$DATE" ]; then args+=(--date "$DATE"); fi
          if [ -n "$SETUPS" ]; then args+=(--setups "$SETUPS"); fi
          npm run stage -- "${args[@]}"
      # The report in the log too, so it can be read without downloading the artifact. It holds the setups' cost, the
      # code checks and every score with its reason, never the articles.
      - name: Print the report
        if: always()
        run: cat .eval/report-*.md || true
      # The report only. The snapshot holds the outlets' article text and stays on the runner.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: model-eval
          retention-days: 3
          # The report is in .eval, a hidden folder, which the upload skips unless told not to. The snapshot beside it
          # is not matched by the paths below, so the article text still stays on the runner.
          include-hidden-files: true
          path: |
            .eval/report-*.md
            .eval/report-*.json
